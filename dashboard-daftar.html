<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Daftar Hati</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[url('https://img-s-msn-com.akamaized.net/tenant/amp/entityid/BB1msOOU?w=0&h=0&q=60&m=6&f=jpg&u=t')] bg-cover bg-center min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Silakan Daftar Hati Anda</h2>

    <form action="#" method="POST" class="space-y-4">
      <div>
        <label for="nama" class="block text-sm font-medium">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" required class="w-full p-2 border border-gray-300 rounded" />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium">Email</label>
        <input type="email" id="email" name="email" required class="w-full p-2 border border-gray-300 rounded" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium">Password</label>
        <input type="password" id="password" name="password" required class="w-full p-2 border border-gray-300 rounded" />
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Daftar</button>
      <a href="dashboard.html" class="mt-4 block text-center text-blue-600 hover:underline text-sm">Kembali Kehalaman Utama</a>
    </form>
  </div>

</body>
</html>
